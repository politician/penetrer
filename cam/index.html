<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b13">
  <title>Zucchini cam</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <video id="camera" autoplay muted playsinline aria-label="Your mirrored camera feed"></video>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <header><a href="../" aria-label="Back to home">←</a><span>ZUCCHINI CAM</span></header>
  <section id="welcome" aria-labelledby="title">
    <div class="vegetable" aria-hidden="true">🥒</div>
    <p class="eyebrow">A LITTLE CAMERA CHAOS</p>
    <h1 id="title">Open wide.<br>Here comes the garden.</h1>
    <p>Cartoon zucchini follow your mouth. Move around and watch them disappear when they arrive.</p>
    <button id="start" type="button">Start camera</button>
    <small>Video stays on your device. Nothing is recorded or uploaded.<br>Camera permission is required.</small>
  </section>
  <footer>
    <p id="status" role="status" aria-live="polite">Ready when you are.</p>
    <div class="controls">
      <button id="fullscreen" type="button">Full screen</button>
      <button id="stop" type="button" hidden>Stop camera</button>
    </div>
  </footer>
</body>
</html>
