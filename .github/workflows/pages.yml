name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install: the suite extracts the page's own core
      # script block and asserts against it.
      - run: node test/run.js
      - run: node test/cam.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish the pages, camera assets and domain file only. The design spec, the
      # implementation plan and the test suite stay in the repo and never
      # reach penetrer.com.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -R cam _site/cam
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

